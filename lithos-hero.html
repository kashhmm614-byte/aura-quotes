<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lithos — Layers hold tales of time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            playfair: ['Playfair Display', 'serif'],
          },
        },
      },
    };
  </script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    .font-playfair { font-family: 'Playfair Display', serif; }

    @keyframes heroReveal {
      0% { opacity: 0; transform: translateY(28px); filter: blur(12px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes heroFadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroZoom {
      0% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .hero-anim {
      opacity: 0;
      animation-fill-mode: forwards;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hero-reveal { animation-name: heroReveal; animation-duration: 1.1s; }
    .hero-fade { animation-name: heroFadeUp; animation-duration: 1s; }
    .hero-zoom { animation: heroZoom 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @media (prefers-reduced-motion: reduce) {
      .hero-anim, .hero-zoom { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root" class="min-h-screen bg-white tracking-[-0.02em]" style="fontFamily: 'Inter', sans-serif;"></div>

  <script>
    const BG_IMAGE_1 = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_195923_b0ba8ace-1d1d-4f2c-9a28-1ab84b330680.png&w=1280&q=85';
    const BG_IMAGE_2 = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260609_201152_bba90a12-bf12-459f-91f0-51f237dbaf3b.png&w=1280&q=85';

    const SPOTLIGHT_R = 260;

    const state = {
      mouse: { x: -999, y: -999 },
      smooth: { x: -999, y: -999 },
      cursorPos: { x: -999, y: -999 },
      rafRef: null,
    };

    function RevealLayer(image, cursorX, cursorY) {
      return `
        <canvas id="maskCanvas" class="absolute inset-0 pointer-events-none" style="display:none"></canvas>
        <div
          id="revealDiv"
          class="absolute inset-0 bg-center bg-cover bg-no-repeat z-30 pointer-events-none"
          style="background-image:url('${image}');opacity:0"
        ></div>
      `;
    }

    function paintMask(canvas, revealDiv, cursorX, cursorY) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;

      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, w, h);

      if (cursorX < -500 || cursorY < -500) {
        revealDiv.style.opacity = '0';
        return;
      }
      revealDiv.style.opacity = '1';

      const g = ctx.createRadialGradient(cursorX, cursorY, 0, cursorX, cursorY, SPOTLIGHT_R);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.4, 'rgba(255,255,255,1)');
      g.addColorStop(0.6, 'rgba(255,255,255,0.75)');
      g.addColorStop(0.75, 'rgba(255,255,255,0.4)');
      g.addColorStop(0.88, 'rgba(255,255,255,0.12)');
      g.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cursorX, cursorY, SPOTLIGHT_R, 0, Math.PI * 2);
      ctx.fill();

      const url = canvas.toDataURL();
      revealDiv.style.maskImage = `url(${url})`;
      revealDiv.style.webkitMaskImage = `url(${url})`;
      revealDiv.style.maskSize = '100% 100%';
      revealDiv.style.webkitMaskSize = '100% 100%';
      revealDiv.style.maskRepeat = 'no-repeat';
      revealDiv.style.webkitMaskRepeat = 'no-repeat';
    }

    function render() {
      state.smooth.x += (state.mouse.x - state.smooth.x) * 0.1;
      state.smooth.y += (state.mouse.y - state.smooth.y) * 0.1;
      state.cursorPos.x = state.smooth.x;
      state.cursorPos.y = state.smooth.y;

      const canvas = document.getElementById('maskCanvas');
      const revealDiv = document.getElementById('revealDiv');
      if (canvas && revealDiv) {
        paintMask(canvas, revealDiv, state.cursorPos.x, state.cursorPos.y);
      }

      state.rafRef = requestAnimationFrame(render);
    }

    function onResize() {
      const canvas = document.getElementById('maskCanvas');
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    }

    function onMouseMove(e) {
      state.mouse.x = e.clientX;
      state.mouse.y = e.clientY;
      if (state.smooth.x < -500) {
        state.smooth.x = e.clientX;
        state.smooth.y = e.clientY;
      }
    }

    function cleanup() {
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('resize', onResize);
      if (state.rafRef) cancelAnimationFrame(state.rafRef);
    }

    function mount() {
      const root = document.getElementById('root');
      root.innerHTML = `
        <section class="relative w-full overflow-hidden h-screen bg-black" style="height:100dvh">
          <!-- 1. Base image -->
          <div
            class="absolute inset-0 bg-center bg-cover bg-no-repeat z-10 hero-zoom"
            style="background-image:url('${BG_IMAGE_1}');"
          ></div>

          <!-- 2. Reveal layer -->
          ${RevealLayer(BG_IMAGE_2, state.cursorPos.x, state.cursorPos.y)}

          <!-- 3. Heading -->
          <div class="absolute top-[14%] left-0 right-0 z-50 flex flex-col items-center text-center px-5 pointer-events-none">
            <h1 class="text-white leading-[0.95]">
              <span
                class="block font-playfair italic font-normal text-5xl sm:text-7xl md:text-8xl hero-anim hero-reveal"
                style="letterSpacing:-0.05em;animation-delay:0.25s"
              >Layers hold</span>
              <span
                class="block font-normal text-5xl sm:text-7xl md:text-8xl -mt-1 hero-anim hero-reveal"
                style="letterSpacing:-0.08em;animation-delay:0.42s"
              >tales of time</span>
            </h1>
          </div>

          <!-- 4. Bottom-left paragraph -->
          <div class="hidden sm:block absolute bottom-14 left-10 md:left-14 max-w-[260px] z-50 hero-anim hero-fade" style="animation-delay:0.7s">
            <p class="text-sm text-white/80 leading-relaxed">Every layer of sediment records a chapter of our planet, from ancient seabeds to drifting ash, layered across millions of years beneath us.</p>
          </div>

          <!-- 5. Bottom-right block -->
          <div
            class="absolute bottom-10 sm:bottom-24 left-5 right-5 sm:left-auto sm:right-10 md:right-14 max-w-full sm:max-w-[260px] z-50 flex flex-col items-start gap-4 sm:gap-5 hero-anim hero-fade"
            style="animation-delay:0.85s"
          >
            <p class="text-xs sm:text-sm text-white/80 leading-relaxed">Our interactive maps let you peel back the crust to trace how stones, fossils, and deep time combine to shape the ground beneath your feet.</p>
            <button
              type="button"
              class="bg-[#e8702a] hover:bg-[#d2611f] text-white text-sm font-medium px-7 py-3 rounded-full transition-all hover:scale-[1.03] active:scale-95 hover:shadow-lg hover:shadow-[#e8702a]/30"
            >Start Digging</button>
          </div>
        </section>

        <!-- Navigation -->
        <nav class="fixed top-0 left-0 right-0 z-[100] flex items-center justify-between p-4 sm:p-5">
          <!-- Left: logo + wordmark -->
          <a href="#" class="flex items-center gap-2">
            <svg width="26" height="26" viewBox="0 0 256 256" fill="#ffffff" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M 256 256 L 128 256 L 0 128 L 128 128 Z M 256 128 L 128 128 L 0 0 L 128 0 Z" />
            </svg>
            <span class="text-white text-2xl font-playfair italic">Lithos</span>
          </a>

          <!-- Center pill -->
          <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 bg-white/20 backdrop-blur-md border border-white/30 rounded-full px-2 py-2 items-center gap-1">
            <button type="button" class="text-white px-4 py-1.5 rounded-full text-sm font-medium">Course</button>
            <button type="button" class="text-white/80 hover:bg-white/20 hover:text-white transition-colors px-4 py-1.5 rounded-full text-sm font-medium">Field Guides</button>
            <button type="button" class="text-white/80 hover:bg-white/20 hover:text-white transition-colors px-4 py-1.5 rounded-full text-sm font-medium">Geology</button>
            <button type="button" class="text-white/80 hover:bg-white/20 hover:text-white transition-colors px-4 py-1.5 rounded-full text-sm font-medium">Plans</button>
            <button type="button" class="text-white/80 hover:bg-white/20 hover:text-white transition-colors px-4 py-1.5 rounded-full text-sm font-medium">Live Tour</button>
          </div>

          <!-- Right: Sign Up (desktop) + hamburger (mobile) -->
          <div class="flex items-center gap-3">
            <button
              type="button"
              class="hidden md:block bg-white text-gray-900 text-sm font-semibold px-6 py-2.5 rounded-full hover:bg-gray-100"
            >Sign Up</button>
            <button
              type="button"
              class="md:hidden text-white p-2"
              aria-label="Open menu"
            >
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="4" y1="7" x2="20" y2="7" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="17" x2="20" y2="17" />
              </svg>
            </button>
          </div>
        </nav>
      `;

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('resize', onResize);
      onResize();
      state.rafRef = requestAnimationFrame(render);
    }

    mount();
    window.addEventListener('pagehide', cleanup);
  </script>
</body>
</html>
